<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Vaibhav Kunghatkar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">VK<span>.devops</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="experience.html">Resume</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <main class="container" style="max-width: 600px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <p class="subtitle">Get In Touch</p>
      <h1 class="title">Contact Me</h1>
    </div>

    <form style="background-color: #181818; border: 1px solid #262626; padding: 2rem; border-radius: 8px; display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label style="display: block; color: #a3a3a3; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">Your Name</label>
        <input type="text" required placeholder="John Doe" style="width: 100%; background-color: #121212; border: 1px solid #404040; color: #fff; padding: 0.75rem; border-radius: 4px;">
      </div>
      <div>
        <label style="display: block; color: #a3a3a3; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">Your Email</label>
        <input type="email" required placeholder="john@example.com" style="width: 100%; background-color: #121212; border: 1px solid #404040; color: #fff; padding: 0.75rem; border-radius: 4px;">
      </div>
      <div>
        <label style="display: block; color: #a3a3a3; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem;">Message</label>
        <textarea rows="5" required placeholder="Write your message..." style="width: 100%; background-color: #121212; border: 1px solid #404040; color: #fff; padding: 0.75rem; border-radius: 4px;"></textarea>
      </div>
      <button type="submit" class="btn-primary" style="cursor: pointer; border: none; margin-top: 0.5rem;">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Vaibhav Kunghatkar. All rights reserved.</p>
  </footer>

</body>
</html>
