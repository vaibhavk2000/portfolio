<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Vaibhav Kunghatkar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="experience.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <main class="container" style="max-width: 650px;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <p class="subtitle">Get In Touch</p>
      <h1 class="title">Contact Me</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Have a DevOps opportunity or infrastructure inquiry? Reach out directly or send a message below.</p>
    </div>

    <!-- Quick Info Cards -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
      <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: 8px; text-align: center;">
        <span style="font-size: 1.2rem;">📧</span>
        <p style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-top: 0.25rem;">Email</p>
        <a href="mailto:vaibhavkunghatkar@gmail.com" style="color: #fff; font-size: 0.85rem; font-weight: 600; text-decoration: none;">vaibhavkunghatkar@gmail.com</a>
      </div>

      <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: 8px; text-align: center;">
        <span style="font-size: 1.2rem;">📞</span>
        <p style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-top: 0.25rem;">Phone</p>
        <a href="tel:+919588660528" style="color: #fff; font-size: 0.85rem; font-weight: 600; text-decoration: none;">+91 9588660528</a>
      </div>
    </div>

    <!-- Contact Form -->
    <form style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; border-radius: 8px; display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label style="display: block; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 600;">Your Name</label>
        <input type="text" required placeholder="John Doe" style="width: 100%; background-color: var(--bg-main); border: 1px solid #404040; color: #fff; padding: 0.75rem; border-radius: 4px; outline: none;">
      </div>
      <div>
        <label style="display: block; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 600;">Your Email</label>
        <input type="email" required placeholder="john@example.com" style="width: 100%; background-color: var(--bg-main); border: 1px solid #404040; color: #fff; padding: 0.75rem; border-radius: 4px; outline: none;">
      </div>
      <div>
        <label style="display: block; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 600;">Message</label>
        <textarea rows="5" required placeholder="Write your message..." style="width: 100%; background-color: var(--bg-main); border: 1px solid #404040; color: #fff; padding: 0.75rem; border-radius: 4px; outline: none;"></textarea>
      </div>
      <button type="submit" class="btn-primary" style="cursor: pointer; border: none; margin-top: 0.5rem; text-align: center;">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Vaibhav Kunghatkar. All rights reserved.</p>
  </footer>

</body>
</html>
